name: tes

on:
  push:
  pull_request:

jobs:
  tes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pasang FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Pasang paket
        run: pip install -e ".[dev]"
      - name: Jalankan tes
        run: pytest -v
